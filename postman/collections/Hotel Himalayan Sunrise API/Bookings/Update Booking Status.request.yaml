$kind: http-request
description: Confirm or cancel a booking (Admin)
url: "{{baseUrl}}/api/bookings/:id/status"
method: PATCH
headers:
  Content-Type: application/json
pathVariables:
  - key: id
    value: REPLACE_WITH_BOOKING_OBJECTID
    description: Booking document ID
body:
  type: text
  content: |-
    {
      "status": "confirmed"
    }
order: 3000
